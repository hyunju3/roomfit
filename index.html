<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="룸핏">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>룸핏 — 치수로 하는 방 꾸미기</title>
<style>
:root{--bg:#F5F3EE;--card:#FFFFFF;--ink:#1F2421;--muted:#5E6660;--line:#D5D2CA;--soft:#ECEAE4;--acc:#2E6B5E;--acc2:#E3EEEA;--warn:#A3471A;--warnbg:#FBEDE4;--red:#C62828;--blue:#2F7FC1;--maxw:860px}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer;touch-action:manipulation}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{display:flex;align-items:center;gap:4px;padding:10px 12px 6px}
.logo{font-weight:800;font-size:20px;color:var(--acc);letter-spacing:-.3px;margin-right:auto}
.ib{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px;padding:0;flex-shrink:0}
.ib:disabled{opacity:.35}
.roombtn{height:42px;padding:0 12px;border-radius:21px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;background:#E7E4DD;border-radius:12px;padding:4px;gap:2px;margin:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:52px;height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;padding:0 8px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);font-weight:700}
main{flex:1;padding:12px 12px 150px;display:flex;flex-direction:column;gap:12px}
.split{display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
@media (min-width:820px){.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.card{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;text-align:center}
.btn.pri{background:var(--acc);color:#fff;border:none;font-weight:700}
.btn.sm{min-height:38px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--red)}
.btn.ghost{border-style:dashed;border-color:#9AA19C;background:transparent}
.grow{flex:1 1 0}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.ttl{display:flex;align-items:center;gap:8px}
.ttl b{flex:1;font-size:16px}
.how{border:none;background:none;color:var(--acc);font-size:13px;font-weight:700;padding:4px}
.chip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:13px;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.planwrap{background:#fff;border-radius:18px;padding:6px}
#planHost,#houseHost{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
svg.plan{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.w{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45;border:none;text-align:left;width:100%}
.w.bad{background:var(--warnbg);color:#8A3A14}
.w.info{background:#EAF2FA;color:#1F5F99}
.w.ok{background:var(--acc2);color:#1F4A41}
.selbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:5}
.selbar[hidden]{display:none!important}
.selbar .in{pointer-events:auto;width:100%;max-width:var(--maxw);background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.1);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.btngrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.btngrid .btn{padding:0 4px;font-size:13px}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--soft)}
.list .it:last-child{border-bottom:none}
.t{flex:1 1 0;overflow:hidden}
.t>b,.t>span{display:block;overflow:hidden;text-overflow:ellipsis}
.sw{width:38px;height:38px;border-radius:9px;flex-shrink:0;background-size:cover;background-position:center;border:1px solid rgba(0,0,0,.06)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,24,22,.42);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px!important}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;font-size:16px;color:var(--ink)}
label.f textarea{padding:10px 12px;min-height:90px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:360px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
#c3{width:100%;height:min(62vw,460px);min-height:280px;display:block;touch-action:none;background:#fff;border-radius:18px}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:52px;height:52px;border-radius:26px;border:1px solid var(--line);padding:0;overflow:hidden;position:relative;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px}
.swatch.on{outline:3px solid var(--acc);outline-offset:2px}
.upl{position:relative;overflow:hidden;cursor:pointer}
.pastebox{width:100%;min-height:42px;border:1px dashed #B9C9C3;border-radius:11px;padding:0 12px;background:#FAFAF8;font-size:14px}
.upl input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.score{width:56px;height:56px;border-radius:28px;border:5px solid var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--acc);flex-shrink:0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:90vw;text-align:center}
textarea.code{width:100%;height:160px;border:1px solid var(--line);border-radius:11px;padding:10px;font-family:ui-monospace,monospace;font-size:16px}
.imgout{width:100%;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.result{background:var(--acc2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.big{font-size:24px;font-weight:800;color:var(--acc)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.cmp th,table.cmp td{padding:8px 4px;border-bottom:1px solid var(--soft);text-align:center;overflow:hidden;text-overflow:ellipsis}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted);width:34%}
.best{color:#2E8A5B;font-weight:800}
.guide-bg{position:fixed;inset:0;background:rgba(20,24,22,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.guide-bg.show{display:flex}
.guide{background:#fff;border-radius:22px;max-width:480px;width:100%;max-height:88vh;max-height:88dvh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.guide h3{margin:0;font-size:20px}
.guide svg{width:100%;height:auto;display:block}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5}
.gdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.gdots i{width:7px;height:7px;border-radius:4px;background:var(--line)}
.gdots i.on{background:var(--acc);width:18px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--acc2);color:#1F4A41}
.tag.tw{background:var(--warnbg);color:#8A3A14}
</style>
</head>
<body>
<div id="app">
<header>
<span class="logo">룸핏</span>
<button class="ib" id="undoB" aria-label="되돌리기">↶</button>
<button class="ib" id="redoB" aria-label="다시 실행">↷</button>
<button class="ib" id="helpB" aria-label="사용 설명서">?</button>
<button class="roombtn" id="roomBtn" aria-label="방 선택">내 방 ▾</button>
</header>
<nav class="tabs" id="tabs">
<button data-tab="house">집 전체</button>
<button data-tab="plan">배치</button>
<button data-tab="3d">3D·벽지</button>
<button data-tab="room">방·요소</button>
<button data-tab="check">점검</button>
<button data-tab="tools">도구</button>
</nav>
<main id="main"></main>
</div>
<div class="selbar" id="selbar" hidden><div class="in" id="selin"></div></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="guide-bg" id="guideBg"><div class="guide" id="guide" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
// ================= utils =================
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d)=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:d};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2200)}
const KEY='roomfit.v2',GKEY='roomfit.gseen';
let GSEEN=(()=>{try{return new Set(JSON.parse(localStorage.getItem(GKEY)||'[]'))}catch(e){return new Set()}})();
function markSeen(id){GSEEN.add(id);try{localStorage.setItem(GKEY,JSON.stringify([...GSEEN]))}catch(e){}}

// ================= constants =================
const CATS=['침대','소파','책상','의자','식탁','옷장','수납장','서랍장','선반','책장','TV장','화장대','협탁','조명','러그','TV·모니터','가전','화분','계단','턱·단차','벽·기둥','기타'];
const CAT_DEF={침대:{w:160,d:200,h:45,c:'#EDE3D6'},소파:{w:160,d:80,h:78,c:'#9DB4C2'},책상:{w:120,d:60,h:73,c:'#E6DCC9'},의자:{w:50,d:50,h:85,c:'#C9C3B7'},식탁:{w:140,d:80,h:73,c:'#D8C3A5'},옷장:{w:100,d:60,h:200,c:'#D9D4CB',open:'hinged',doors:2},수납장:{w:80,d:40,h:90,c:'#E2D7C5',open:'hinged',doors:2},서랍장:{w:120,d:45,h:80,c:'#E6DCC9',open:'drawer'},선반:{w:80,d:30,h:180,c:'#D9CBB4'},책장:{w:80,d:30,h:180,c:'#D9CBB4'},TV장:{w:160,d:40,h:50,c:'#CFC6B6',open:'drawer'},화장대:{w:100,d:45,h:75,c:'#EADFD0',open:'drawer'},협탁:{w:45,d:40,h:50,c:'#E6DCC9',open:'drawer'},조명:{w:40,d:40,h:150,c:'#F2E2A9',power:true},러그:{w:160,d:120,h:1,c:'#D9CFC0'},'TV·모니터':{w:123,d:25,h:75,c:'#3A3F44',power:true},가전:{w:60,d:60,h:85,c:'#E4E7EA',power:true},화분:{w:40,d:40,h:90,c:'#9DBF9A'},계단:{w:90,d:250,h:250,c:'#E0D3BC',steps:14},'턱·단차':{w:90,d:20,h:5,c:'#E8B79A'},'벽·기둥':{w:60,d:60,h:240,c:'#CFCAC0'},기타:{w:60,d:60,h:60,c:'#D5D2CA'}};
const FLOOR_ITEMS=['러그','턱·단차'];
const OPEN_TYPES={none:'없음',hinged:'여닫이',sliding:'슬라이딩',drawer:'서랍'};
const OT={door:'여닫이 문',slide:'슬라이딩 문',window:'창문',outlet:'콘센트',switch:'스위치',step:'문턱·턱'};
const WALLS={N:'위쪽 벽',E:'오른쪽 벽',S:'아래쪽 벽',W:'왼쪽 벽'};
const WALLPAPERS={white:{n:'화이트',c:'#F7F5F0'},sage:{n:'세이지 리프',c:'#DCE6DE'},stripe:{n:'스트라이프',c:'#EFE7DA'},terra:{n:'테라코타',c:'#C9876A'},navy:{n:'네이비',c:'#3E4C63'},dots:{n:'도트',c:'#F2EBE0'},check:{n:'체크',c:'#EEF0F2'},beige:{n:'베이지 실크',c:'#E9DFCF'}};
const FLOORS={oak:{n:'오크 마루',c:'#D6B994'},walnut:{n:'월넛 마루',c:'#8B6748'},herring:{n:'헤링본',c:'#CDAE85'},tile:{n:'화이트 타일',c:'#E9E6E0'},marble:{n:'대리석',c:'#F1EFEC'},deco:{n:'데코타일',c:'#BFB8AC'},lino:{n:'장판',c:'#E3D2B0'},gray:{n:'그레이 타일',c:'#B9B6AF'}};
const ROLLS={silk:{n:'실크 (106cm × 15.6m)',w:106,l:1560,kind:'silk',ov:0},wide:{n:'광폭 합지 (93cm × 17.75m)',w:93,l:1775,kind:'hapji',ov:1},narrow:{n:'소폭 합지 (53cm × 12.5m)',w:53,l:1250,kind:'hapji',ov:1},sticker:{n:'스티커·접착식 (예: 50cm × 10m)',w:50,l:1000,kind:'sticker',ov:1},custom:{n:'직접 입력',w:100,l:1000,kind:'hapji',ov:0}};
const KINDS={silk:'실크(풀 시공)',hapji:'합지(풀 시공)',sticker:'스티커·접착식'};
const DIRS={0:'북',45:'북동',90:'동',135:'남동',180:'남',225:'남서',270:'서',315:'북서'};
const SEASONS={spring:{n:'봄',d:80},summer:{n:'여름',d:172},autumn:{n:'가을',d:266},winter:{n:'겨울',d:355}};

// ================= guides (새 기능을 추가하면 여기에 항목을 추가) =================
const GUIDES=[
 {id:'start',title:'룸핏 시작하기',steps:['오른쪽 위 방 이름을 눌러 방을 고르거나 새로 만들어요.','<b>방·요소</b> 탭에서 방의 가로·세로·천장 높이를 cm로 넣어요.','같은 탭에서 문, 창문, 콘센트, 스위치, 문턱을 벽에 붙여요.','<b>배치</b> 탭에서 가구를 추가하고 손가락으로 끌어서 옮겨요.','<b>3D·벽지</b>에서 입체로 보고 벽지·바닥재를 바꿔요.','<b>점검</b>에서 겹침·통로·콘센트·햇빛을 확인해요.','↶ ↷ 로 언제든 되돌릴 수 있어요.','각 탭에 처음 들어가면 그 탭 사용법이 그림과 함께 나와요. 다시 보려면 위쪽 <b>?</b> 를 누르세요.']},
 {id:'house',tab:'house',title:'집 전체 · 평면도 사진',steps:['<b>집 전체</b> 탭은 모든 방을 한 장에 보여줘요. 층 버튼으로 1층·2층(다락)을 바꿔요.','방을 끌어서 실제 집 모양대로 붙여요. 다른 방 벽 가까이 가면 딱 붙어요.','방을 누르면 선택돼요. 오른쪽 아래 동그란 손잡이를 끌면 방 크기가 바뀌어요.','선택한 방의 <b>들어가기</b>를 누르면 그 방 배치 화면으로 가요.','<b>평면도 사진</b>을 올리면 바닥에 깔려요. <b>축척 맞추기</b>를 누르고 사진 위 두 점을 찍은 뒤 실제 길이(예: 현관문 90cm)를 넣으면 크기가 맞춰져요.','사진 위에 방을 끌어다 맞추면 도면대로 집이 만들어져요. (사진 속 벽을 자동으로 읽지는 않아요)']},
 {id:'room',tab:'room',title:'방 크기 · 문 · 창문 · 콘센트',steps:['가로·세로·천장 높이를 바꾸면 바로 반영돼요.','<b>＋ 여닫이 문</b> 등을 눌러 어느 벽, 몇 cm 지점에 있는지 넣어요.','콘센트·스위치는 바닥에서 높이, 창문은 창틀 높이와 창 높이를 넣어요.','배치 화면에서 벽 위의 문·창문·콘센트를 끌어서 위치를 옮길 수도 있어요.','방이 몇 층인지(층 선택)도 여기서 바꿔요.']},
 {id:'items',tab:'plan',title:'가구 넣기 · 옮기기 · 보관함',steps:['가구를 <b>손가락으로 누른 채 그대로 끌면</b> 옮겨져요. 눌렀다 떼면 선택만 되고, 아래 ◀▲▼▶ 로 5cm씩 옮길 수도 있어요.','<b>＋ 가구 추가</b>에서 종류를 고르면 보통 크기가 채워져요. 실제 치수로 고쳐요.','목록에 없는 가구는 종류에서 <b>＋ 직접 입력</b>을 골라요.','쇼핑몰 상세페이지의 치수 글자를 복사해 <b>상품 설명 붙여넣기</b>에 넣으면 가로·깊이·높이를 자동으로 찾아요.','가구를 누르면 아래에 ↻회전 · 수정 · 복제 · <b>옮기기</b> · 삭제가 나와요.','<b>옮기기</b>는 다른 방이나 <b>보관함</b>으로 보내요. 보관함 가구는 배치 화면 아래에서 다시 꺼낼 수 있어요.','굵은 선이 가구 앞면이에요. 문 열리는 방향을 맞추려면 회전하세요.','가구 사진을 올리면 3D에서 앞면에 씌워져요.','사진 고르는 창이 안 뜨면 Claude 앱 안이라 막힌 거예요. 크롬·사파리에서 열거나, 갤러리에서 사진을 <b>복사</b>한 뒤 "사진 붙여넣기" 칸을 길게 눌러 붙여넣어요.']},
 {id:'shape',tab:'room',title:'네모가 아닌 방 · 기둥',steps:['먼저 방의 <b>바깥 네모</b> 크기(가장 긴 가로·세로)를 넣어요.','<b>방·요소 → 방 모양 → ㄱ·ㄴ자 모서리</b>를 누르고, 빠지는 모서리와 크기를 고르면 그 부분이 벽으로 채워져요.','튀어나온 벽, 기둥, 붙박이장 자리는 <b>＋ 기둥·벽</b>으로 넣고 끌어서 맞춰요. 크기는 수정에서 바꿔요.','벽·기둥은 가구처럼 겹침·동선 계산에 들어가고, 면적에서는 빠져요.','더 복잡한 모양은 <b>집 전체</b>에서 방 두 개를 붙여서 만들어도 돼요.','<b>네모</b> 버튼을 누르면 모서리 벽이 없어지고 다시 네모 방이 돼요.']},
 {id:'stack',tab:'plan',title:'가구 위에 올리기 (TV · 가전)',steps:['TV, 모니터, 가전, 조명, 화분은 다른 가구 위로 <b>끌어다 놓으면</b> 자동으로 그 위에 올라가요.','다른 가구도 올리려면 가구를 누르고 <b>⬆ 올리기</b>에서 어느 가구 위에 올릴지 골라요.','벽걸이 TV처럼 공중에 거는 건 <b>직접 높이</b>에 바닥에서 높이(cm)를 넣어요.','올린 가구는 파란 점선과 ↑높이로 표시되고, 아래 가구를 옮기면 같이 따라가요.','올린 가구끼리는 겹쳐도 경고하지 않고, 3D에서도 그 높이에 보여요.','내리려면 ⬆ 올리기 → <b>바닥에 놓기</b>를 누르거나, 아래 가구 밖으로 끌어내요.']},
 {id:'photo',tab:'3d',also:['plan'],title:'가구 사진 씌우기 (앞·뒤·옆·위)',steps:['가구를 누르고 <b>수정</b>을 열면 사진 칸이 5개 있어요: <b>앞 · 뒤 · 왼쪽 · 오른쪽 · 위</b>.','각 칸을 누르고 그 면을 찍은 사진을 고르면 3D에서 그 면에 씌워져요. 앞면(초록 테두리)은 꼭 넣는 걸 추천해요.','왼쪽·오른쪽은 가구 <b>앞에 서서</b> 봤을 때 기준이에요.','사진은 가구 면에 꽉 차게 늘어나요. 가구만 나오게 잘라서 올리면 가장 자연스러워요.','사진 창이 안 뜨면 갤러리에서 사진을 복사하고, <b>붙여넣을 면</b>을 고른 뒤 붙여넣기 칸을 길게 눌러 붙여넣어요.']},
 {id:'stairs',tab:'plan',title:'계단 · 턱 · 단차',steps:['문 아래 문턱은 <b>방·요소 → ＋ 문턱·턱</b>으로 벽에 붙여요.','방 안의 단차는 <b>가구 추가 → 턱·단차</b>, 계단은 <b>계단</b>을 골라요.','계단은 단 수와 전체 높이를 넣으면 3D에서 계단 모양으로 보여요. 낮은 쪽이 앞면이에요.','턱·단차와 러그는 다른 가구와 겹쳐도 경고하지 않아요.']},
 {id:'3d',tab:'3d',title:'3D · 벽지 · 바닥재',steps:['화면을 끌면 방이 돌아가요. 각도 슬라이더로 위에서 보는 정도를 바꿔요.','<b>벽 잘라보기</b>를 낮추면 벽이 잘려서 방 안이 잘 보여요.','벽을 고르고 벽지를 누르면 그 벽에만 발라져요. <b>모든 벽에 적용</b>도 있어요.','📷 를 누르면 내 사진을 벽지·바닥재로 쓸 수 있어요.','<b>무늬 크기</b>에 실제 벽지 무늬(또는 사진 한 장)의 가로·세로 cm를 넣으면 그 크기로 반복돼요.','<b>이미지로</b>를 누르면 그림이 나와요. 길게 눌러 저장하세요.']},
 {id:'check',tab:'check',title:'점검 · 동선 · 콘센트 · 햇빛 · 빈 자리',steps:['<b>문제</b>: 겹침, 가구 문이 열릴 자리, 방문 앞, 창문 가림, 좁은 통로를 찾아요. 누르면 그 가구로 가요.','<b>동선</b>: 방문에서 각 가구 앞까지 걸어갈 길을 그려요. 초록 60cm 이상, 주황 45~60cm, 빨강은 못 가요.','<b>콘센트</b>: 전기 쓰는 가구에서 가장 가까운 콘센트까지 거리를 재요. 1.5m가 넘으면 멀티탭 길이를 알려줘요.','<b>햇빛</b>: 창문 방향과 계절·시간을 고르면 바닥에 해가 드는 곳을 그려요. 창문 방향은 처음 한 번만 정하면 돼요.','<b>빈 자리</b>: 평면의 빈 곳을 누르면 들어갈 수 있는 최대 크기와, 내 가구 중 들어가는 것을 알려줘요.']},
 {id:'calc',tab:'tools',title:'벽지 · 바닥재 계산기',steps:['<b>도구</b> 탭의 벽지 계산기에서 롤 규격(실크 106cm, 합지 93cm 등)을 고르세요.','무늬 반복 길이(무지면 0)와 계산할 벽을 고르면 필요한 롤 수가 나와요.','문·창문 빼기를 켜면 면적에서 빠져요. 로스(여유분)도 바꿀 수 있어요.','<b>직접 입력</b>을 고르면 방과 상관없이 벽 길이·높이를 넣어 계산해요.','바닥재 계산기는 마루·장판·타일 종류별로 필요한 면적, 장 수, 길이를 알려줘요.']},
 {id:'hang',tab:'tools',also:['3d'],title:'벽지 붙이기 · 전개도 · 재단표',steps:['<b>도구</b> 탭의 벽지 계산기에서 롤 규격과 무늬 반복 길이를 먼저 맞춰요.','<b>최소 사용</b>은 자투리를 최대한 다시 써서 롤을 아끼고, <b>깔끔하게</b>는 창문 가운데에 맞추고 좁은 조각을 없애요. 버튼에 두 방식의 롤 수가 같이 나와요.','<b>전개도</b>에서 벽마다 폭 번호, 이음매(빨간 선), 첫 수직선(파란 점선)을 봐요. 분홍 폭은 15cm보다 좁은 조각이에요.','<b>재단표</b>대로 롤마다 잘라서 뒷면에 번호를 적어두면 순서가 안 헷갈려요.','<b>붙이는 순서 보기</b>를 누르면 준비부터 마무리까지 9단계가 그림과 체크리스트로 나와요.','문 쪽 벽을 마지막에 붙이도록 순서를 짜서, 무늬가 안 맞는 마지막 이음매는 문 근처에 와요.','<b>자투리 활용(최소 사용)</b>: 벽 끝에서 잘라낸 남은 폭은 다음 벽 첫 폭으로, 문·창문 자리에서 오려낸 조각은 창 위·아래나 문 위로 써요. 전개도에서 노란 점선 칸이에요.','<b>문·창문 위치 반영</b>: 이음매를 문·창문 가장자리에 맞추는 경우도 비교해서, 그쪽이 덜 쓰이면 그렇게 배치해요. 그러면 문·창문 위아래는 짧은 조각만 붙이면 되고, 틀 주위를 오려내는 일도 줄어요. 틀에서 8cm 안쪽에 이음매가 생기는 배치는 피해요.','<b>스티커 벽지</b>는 계산기에서 "스티커·접착식"을 고르면 풀·초배지 없이 계산하고, 겹침 1cm와 붙이는 순서도 스티커용으로 바뀌어요.']},
 {id:'compare',tab:'tools',title:'배치안 비교',steps:['지금 배치를 <b>현재 배치 저장</b>으로 A안, B안처럼 저장해요.','가구를 바꿔 본 다음 다시 저장하면 여러 안이 생겨요.','표에서 점검 점수, 문제 수, 가장 좁은 통로, 콘센트 거리를 나란히 비교해요. 더 좋은 칸은 초록색이에요.','<b>이 안으로</b>를 누르면 그 배치로 돌아가요. 마음에 안 들면 ↶ 로 되돌려요.']},
 {id:'data',tab:'tools',title:'되돌리기 · 백업 · 다른 기기',steps:['↶ 되돌리기, ↷ 다시 실행으로 최근 30번까지 오갈 수 있어요.','모든 내용은 지금 쓰는 기기의 브라우저에 자동 저장돼요.','다른 기기로 옮기거나 백업하려면 <b>도구 → 데이터</b>에서 JSON을 복사해 두고, 새 기기에서 붙여넣어 불러와요.','사진을 많이 올리면 저장 공간이 부족할 수 있어요. 그때는 안 쓰는 사진을 지워주세요.']}
];

function runChecks(r){

    if(z.x0<-0.5||z.y0<-0.5||z.x1>r.W+0.5||z.y1>r.D+0.5)out.push({t:'bad',k:'swing',m:`${a.name}의 문이 벽에 막혀요. 앞면이 벽을 보고 있어요 (회전해 보세요)`,ids:[a.id]})});
  r.openings.forEach(o=>{const z=openZone(r,o);if(!z)return;solid.forEach(b=>{if(zOf(b)<200&&overlap(z,rectOf(b)))out.push({t:'bad',k:'door',m:`${OT[o.type]} ${o.type==='slide'?'앞을 막아요':'열리는 범위와 겹쳐요'} — ${b.name}`,ids:[b.id]})})});

    let best=1e9,bp=null;outs.forEach(p=>{const d=distPtRect(p[0],p[1],rectOf(it));if(d<best){best=d;bp=p}});it._pw={d:best,p:bp};

  return out;
}

// path analysis on 5cm grid
function pathAnalysis(r){

  const solid=r.items.filter(i=>!isFloor(i)&&zOf(i)<100);

  const d=new Float32Array(N);for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){const i=y*nx+x;d[i]=occ[i]?0:Math.min((x+0.5)*C,(nx-x-0.5)*C,(y+0.5)*C,(ny-y-0.5)*C)}

  for(let y=ny-1;y>=0;y--)for(let x=nx-1;x>=0;x--){const i=y*nx+x;let v=d[i];if(x<nx-1)v=Math.min(v,d[i+1]+C);if(y<ny-1){v=Math.min(v,d[i+nx]+C);if(x<nx-1)v=Math.min(v,d[i+nx+1]+s2);if(x>0)v=Math.min(v,d[i+nx-1]+s2)}d[i]=v}
  const cell=(px,py)=>[clamp(Math.floor(px/C),0,nx-1),clamp(Math.floor(py/C),0,ny-1)];
  const doors=r.openings.filter(o=>o.type==='door'||o.type==='slide');
  const starts=doors.map(o=>{const p=wallPt(r,o.wall,o.pos+o.w/2),n=inward(o.wall);return[p[0]+n[0]*35,p[1]+n[1]*35]});

    for(let h=0;h<q.length;h++){const i=q[h],x=i%nx,y=(i/nx)|0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=nx||Y>=ny)continue;const j=Y*nx+X;if(par[j]!==-2||d[j]<need/2)continue;par[j]=i;q.push(j)}}return par};
  const P60=bfs(60),P45=bfs(45);
  const res=[];
  solid.filter(it=>!isWall(it)&&onFloor(it)).forEach(it=>{const q=rectOf(it);const [fx,fy]=frontVec(it.rot);const c=clearOf(it);const off=Math.max(35,c+20);
    const tp=[(q.x0+q.x1)/2+fx*((q.x1-q.x0)/2+off),(q.y0+q.y1)/2+fy*((q.y1-q.y0)/2+off)];
    const find=par=>{const [cx,cy]=cell(tp[0],tp[1]);let best=-1,bd=1e9;for(let y=cy-4;y<=cy+4;y++)for(let x=cx-4;x<=cx+4;x++){if(x<0||y<0||x>=nx||y>=ny)continue;const j=y*nx+x;if(par[j]===-2)continue;const dd=Math.hypot(x-cx,y-cy);if(dd<bd){bd=dd;best=j}}return best};
    let status='blocked',j=find(P60),par=P60;if(j>=0)status='ok';else{j=find(P45);par=P45;if(j>=0)status='narrow'}

    res.push({it,status,path,minw:Math.round(minw),target:tp})});

// sun
function sunPos(season,hour){const n=SEASONS[season].d;const dec=23.44*Math.sin(2*Math.PI*(284+n)/365)*Math.PI/180;const lat=37.5*Math.PI/180;const Hh=15*(hour-12.5)*Math.PI/180;

  let az=Math.atan2(Math.sin(Hh),Math.cos(Hh)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))*180/Math.PI+180;return{alt,az}}
function sunPolys(r,season,hour){const {alt,az}=sunPos(season,hour);if(alt<=0.02)return{alt,az,polys:[],hits:[]};
  const rel=(az-S.house.north)*Math.PI/180;const sd=[Math.sin(rel),-Math.cos(rel)];const L=[-sd[0],-sd[1]];const t=1/Math.tan(alt);const polys=[];
  r.openings.filter(o=>o.type==='window').forEach(o=>{const n=inward(o.wall);if(L[0]*n[0]+L[1]*n[1]<=0.05)return;const a=along(o.wall),p0=wallPt(r,o.wall,o.pos),p1=[p0[0]+a[0]*o.w,p0[1]+a[1]*o.w];
    const off=z=>[L[0]*z*t,L[1]*z*t];const lo=off(o.elev),hi=off(o.elev+o.h);polys.push([[p0[0]+lo[0],p0[1]+lo[1]],[p1[0]+lo[0],p1[1]+lo[1]],[p1[0]+hi[0],p1[1]+hi[1]],[p0[0]+hi[0],p0[1]+hi[1]]])});
  const hits=r.items.filter(it=>!isFloor(it)).filter(it=>{const q=rectOf(it);for(let i=0;i<=4;i++)for(let j=0;j<=4;j++){const x=q.x0+(q.x1-q.x0)*i/4,y=q.y0+(q.y1-q.y0)*j/4;if(polys.some(P=>inPoly(x,y,P)))return true}return false});

// fit finder
function fitAt(r,px,py){const C=5,nx=Math.ceil(r.W/C),ny=Math.ceil(r.D/C);const occ=new Uint8Array(nx*ny);
  const block=q=>{for(let y=Math.max(0,Math.floor(q.y0/C));y<Math.min(ny,Math.ceil(q.y1/C));y++)for(let x=Math.max(0,Math.floor(q.x0/C));x<Math.min(nx,Math.ceil(q.x1/C));x++)occ[y*nx+x]=1};
  r.items.filter(i=>!isFloor(i)&&zOf(i)<100).forEach(it=>{block(rectOf(it));const z=zoneOf(it);if(z)block(z)});r.openings.forEach(o=>{const z=openZone(r,o);if(z)block(z)});
  let cx=clamp(Math.floor(px/C),0,nx-1),cy=clamp(Math.floor(py/C),0,ny-1);if(occ[cy*nx+cx])return null;
  let x0=cx,x1=cx,y0=cy,y1=cy;const colFree=(x,a,b)=>{if(x<0||x>=nx)return false;for(let y=a;y<=b;y++)if(occ[y*nx+x])return false;return true};const rowFree=(y,a,b)=>{if(y<0||y>=ny)return false;for(let x=a;x<=b;x++)if(occ[y*nx+x])return false;return true};
  let grew=true;while(grew){grew=false;if(colFree(x0-1,y0,y1)){x0--;grew=true}if(colFree(x1+1,y0,y1)){x1++;grew=true}if(rowFree(y0-1,x0,x1)){y0--;grew=true}if(rowFree(y1+1,x0,x1)){y1++;grew=true}}
  return{x0:x0*C,y0:y0*C,x1:Math.min(r.W,(x1+1)*C),y1:Math.min(r.D,(y1+1)*C)}}

let PS=1,PAD=24;

  PS=(vw-PAD*2)/r.W;const vh=r.D*PS+PAD*2;const X=x=>(PAD+x*PS).toFixed(1),Y=y=>(PAD+y*PS).toFixed(1),L=v=>(Math.max(0,v)*PS).toFixed(1);

    if(it.open==='hinged'){const q=rectOf(it);const [fx,fy]=frontVec(it.rot);const n=Math.max(1,it.doors);const horiz=fy!==0;const len=horiz?(q.x1-q.x0):(q.y1-q.y0);const leaf=len/n;

function rotateRoom(r){const W=r.W,D=r.D;r.W=D;r.D=W;// rotate contents 90° clockwise

  r.items.forEach(it=>{const x=it.x,y=it.y;it.x=D-y;it.y=x;it.rot=(it.rot+90)%360})}
function houseBounds(lv){const rs=S.rooms.filter(r=>r.level===lv);let x0=0,y0=0,x1=400,y1=300;if(rs.length){x0=Math.min(...rs.map(r=>r.hx));y0=Math.min(...rs.map(r=>r.hy));x1=Math.max(...rs.map(r=>r.hx+r.W));y1=Math.max(...rs.map(r=>r.hy+r.D))}

function houseSVG(vw){const lv=S.house.level;const b=hview||houseBounds(lv);const sc=vw/(b.x1-b.x0);const vh=(b.y1-b.y0)*sc;const X=x=>((x-b.x0)*sc).toFixed(1),Y=y=>((y-b.y0)*sc).toFixed(1),L=v=>(v*sc).toFixed(1);
  let s=`<svg class="plan" id="hsvg" viewBox="0 0 ${vw} ${vh.toFixed(0)}" role="img" aria-label="${lv}층 집 전체 평면도"><defs><pattern id="hz2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#C2410C" stroke-width="2"/></pattern></defs>`;
  const bg=S.house.bg;if(bg&&bg.level===lv)s+=`<image href="${bg.src}" x="${X(bg.x)}" y="${Y(bg.y)}" width="${L(bg.w*bg.s)}" height="${L(bg.h*bg.s)}" opacity="${bg.op??0.55}" preserveAspectRatio="none"/>`;
  S.rooms.filter(r=>r.level===lv).forEach(r=>{const on=houseSel===r.id,cur=R()===r;const ox=r.hx,oy=r.hy;
    s+=`<g data-room="${r.id}"><rect x="${X(ox)}" y="${Y(oy)}" width="${L(r.W)}" height="${L(r.D)}" fill="${cur?'#F3F7F5':'#fff'}" fill-opacity="${bg&&bg.level===lv?0.75:1}"/>`;
    r.items.forEach(it=>{const q=rectOf(it);s+=`<rect x="${X(ox+q.x0)}" y="${Y(oy+q.y0)}" width="${L(q.x1-q.x0)}" height="${L(q.y1-q.y0)}" fill="${it.cat==='턱·단차'?'url(#hz2)':isWall(it)?(it.shape?'#F5F3EE':'#6E736F'):it.color}" stroke="rgba(0,0,0,.2)" pointer-events="none"/>`;
      if(it.cat==='계단'){const n=Math.max(2,it.steps||12);const [fx,fy]=frontVec(it.rot);for(let k=1;k<n;k++){if(fy!==0){const yy=q.y0+(q.y1-q.y0)*k/n;s+=`<line x1="${X(ox+q.x0)}" x2="${X(ox+q.x1)}" y1="${Y(oy+yy)}" y2="${Y(oy+yy)}" stroke="rgba(0,0,0,.3)" pointer-events="none"/>`}else{const xx=q.x0+(q.x1-q.x0)*k/n;s+=`<line y1="${Y(oy+q.y0)}" y2="${Y(oy+q.y1)}" x1="${X(ox+xx)}" x2="${X(ox+xx)}" stroke="rgba(0,0,0,.3)" pointer-events="none"/>`}}}});
    s+=`<rect x="${X(ox)}" y="${Y(oy)}" width="${L(r.W)}" height="${L(r.D)}" fill="none" stroke="${on?'#2E6B5E':'#1F2421'}" stroke-width="${on?5:4}"/>`;
    r.openings.forEach(o=>{const a=along(o.wall),p=wallPt(r,o.wall,o.pos),q=[p[0]+a[0]*o.w,p[1]+a[1]*o.w];const col={window:'#8FB8D8',door:'#fff',slide:'#fff',step:'#E8B79A'}[o.type];if(!col)return;s+=`<line x1="${X(ox+p[0])}" y1="${Y(oy+p[1])}" x2="${X(ox+q[0])}" y2="${Y(oy+q[1])}" stroke="${col}" stroke-width="${o.type==='step'?6:5}" pointer-events="none"/>`;if(o.type==='step')s+=`<text x="${X(ox+(p[0]+q[0])/2)}" y="${(+Y(oy+(p[1]+q[1])/2)-6).toFixed(1)}" font-size="10" font-weight="700" fill="#A3471A" text-anchor="middle" pointer-events="none">턱 ${o.h}</text>`});
    s+=`<text x="${X(ox+r.W/2)}" y="${Y(oy+r.D/2)}" text-anchor="middle" font-size="13" font-weight="800" fill="#1F2421" pointer-events="none" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(r.name)}</text><text x="${X(ox+r.W/2)}" y="${(+Y(oy+r.D/2)+15).toFixed(1)}" text-anchor="middle" font-size="11" fill="#5E6660" pointer-events="none" paint-order="stroke" stroke="#fff" stroke-width="3">${r.W}×${r.D}</text>`;
    if(on)s+=`<circle data-resize="${r.id}" cx="${X(ox+r.W)}" cy="${Y(oy+r.D)}" r="13" fill="#2E6B5E" stroke="#fff" stroke-width="3"/>`;
    s+='</g>'});

  if(scaleMode&&scaleMode.pts&&scaleMode.pts.length===2){const [a,c]=scaleMode.pts;s+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}" stroke="#C62828" stroke-width="3"/>`}
  return{svg:s+'</svg>',sc,b}}
let HS={sc:1,b:{x0:0,y0:0}};
function drawHouse(){const host=$('#houseHost');if(!host)return;const {svg,sc,b}=houseSVG(hostW('#houseHost'));host.innerHTML=svg;HS={sc,b};bindHouse()}
function bindHouse(){const host=$('#houseHost');if(!host||host._bound)return;host._bound=true;let pid=null;
  const toCm=e=>{const el=host.querySelector('svg');const [px,py]=svgPt(el,e);return[px/HS.sc+HS.b.x0,py/HS.sc+HS.b.y0]};
  host.addEventListener('pointerdown',e=>{if(!host.querySelector('svg'))return;const p=toCm(e);
    if(scaleMode){scaleMode.pts=scaleMode.pts||[];scaleMode.pts.push(p);drawHouse();if(scaleMode.pts.length===2)scaleSheet();else{const w=$('#scInfo');if(w)w.firstChild.textContent=`사진 위에서 실제 길이를 아는 두 점을 차례로 눌러요 (1/2) `}return}
    const rz=e.target.closest('[data-resize]'),g=e.target.closest('[data-room]');hview=houseBounds(S.house.level);
    if(rz){const r=S.rooms.find(x=>x.id===rz.dataset.resize);hdrag={kind:'size',r,p0:p,W0:r.W,D0:r.D,moved:false}}
    else if(g){const r=S.rooms.find(x=>x.id===g.dataset.room);houseSel=r.id;hdrag={kind:'move',r,dx:p[0]-r.hx,dy:p[1]-r.hy,moved:false}}
    else{houseSel=null;hdrag=null;hview=null}
    pid=e.pointerId;try{host.setPointerCapture(e.pointerId)}catch(_){}if(hdrag)e.preventDefault();drawHouse();renderSelbar()});
  host.addEventListener('pointermove',e=>{if(!hdrag||e.pointerId!==pid)return;e.preventDefault();const p=toCm(e);const r=hdrag.r;hdrag.moved=true;
    if(hdrag.kind==='size'){r.W=clamp(Math.round((hdrag.W0+p[0]-hdrag.p0[0])/5)*5,100,3000);r.D=clamp(Math.round((hdrag.D0+p[1]-hdrag.p0[1])/5)*5,100,3000)}
    else{let x=Math.round((p[0]-hdrag.dx)/5)*5,y=Math.round((p[1]-hdrag.dy)/5)*5;const sn=20;
      S.rooms.filter(o=>o!==r&&o.level===r.level).forEach(o=>{const ex=[o.hx,o.hx+o.W],ey=[o.hy,o.hy+o.D];
        [[x,0],[x+r.W,r.W]].forEach(([v,off])=>ex.forEach(t=>{if(Math.abs(v-t)<sn)x=t-off}));[[y,0],[y+r.D,r.D]].forEach(([v,off])=>ey.forEach(t=>{if(Math.abs(v-t)<sn)y=t-off}))});
      r.hx=x;r.hy=y}
    if(!hRaf){hRaf=true;requestAnimationFrame(()=>{hRaf=false;drawHouse()})}},{passive:false});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;if(hdrag&&hdrag.moved)save();hdrag=null;hview=null;drawHouse();renderSelbar()};host.addEventListener('pointerup',end);host.addEventListener('pointercancel',end)}
function renderHouseTab(){const lv=S.house.level;const levels=[...new Set(S.rooms.map(r=>r.level).concat([1]))].sort();const rs=S.rooms.filter(r=>r.level===lv);const area=rs.reduce((a,r)=>a+roomArea(r),0)/10000;const bg=S.house.bg;

  const rw=calc.rw,rl=calc.rl*100,rep=calc.rep;let strips=0,stripLen=0,area=0,subA=0;
  walls.forEach(w=>{const s=Math.ceil(w.l/Math.max(5,rw-(calc.ov||0)));strips+=s;let L=w.h+10;if(rep>0)L=Math.ceil(L/rep)*rep;stripLen=Math.max(stripLen,L);area+=w.l*w.h;subA+=w.sub});
  if(!calc.sub)subA=0;const per=stripLen>0?Math.floor(rl/stripLen):0;

  const rolls=per>0?Math.ceil(effStrips/per):Infinity;const areaRolls=Math.ceil(((area-subA)/(rw*rl))*(1+calc.loss/100)*10)/10;
  return{walls,strips,effStrips,stripLen,per,rolls,area:(area-subA)/10000,areaRolls,totalLen:(effStrips*stripLen/100)}}

function processFile(f,maxPx,cb){if(!f||!/^image\//.test(f.type||'image/')){toast('사진 파일이 아니에요');return}toast('사진 불러오는 중…');

function parseDims(t){if(!t)return null;let s=t.replace(/[×＊*✕xX]/g,'x').replace(/,/g,'');const mm=/mm|밀리/i.test(s);const get=re=>{const m=s.match(re);return m?parseFloat(m[1]):null};

  if(w==null||d==null){const m=s.match(/(\d+(?:\.\d+)?)\s*(?:mm|cm)?\s*x\s*(\d+(?:\.\d+)?)\s*(?:mm|cm)?\s*(?:x\s*(\d+(?:\.\d+)?))?/i);if(m){w=w??parseFloat(m[1]);d=d??parseFloat(m[2]);if(m[3])h=h??parseFloat(m[3])}}

let gstate=null;
function tabGuides(t){const l=GUIDES.map((g,i)=>[g,i]);return l.filter(([g])=>g.tab===t&&g.id!=='photo').concat(l.filter(([g])=>(g.tab===t&&g.id==='photo')||(g.tab!==t&&(g.also||[]).includes(t)))).map(([g,i])=>i)}

function drawGuide(){const idx=gstate.list[gstate.k];const g=GUIDES[idx];markSeen(g.id);const n=gstate.list.length,k=gstate.k;
  $('#guide').innerHTML=`<span class="tag">${n>1?`사용법 ${k+1}/${n}`:'사용법'}</span><h3>${g.title}</h3>${GUIDE_IMG[g.id]?`<div style="background:#F5F3EE;border-radius:14px;padding:8px">${GUIDE_IMG[g.id]}</div>`:''}<ol>${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  ${n>1?`<div class="gdots">${gstate.list.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div><div class="g3"><button class="btn" id="gSkip">닫기</button><button class="btn" id="gPrev" ${k===0?'disabled':''}>이전</button><button class="btn pri" id="gNext">${k===n-1?'확인':'다음'}</button></div>`
  :`<div class="g2">${g.tab&&g.tab!==tab?`<button class="btn" id="gGo">이 화면으로 가기</button>`:'<span></span>'}<button class="btn pri" id="gSkip">확인</button></div>`}<button class="how" id="gAll">전체 설명서 보기</button>`;
  const close=()=>{$('#guideBg').classList.remove('show');if(g.id==='start')maybeTabGuides(tab)};
  $('#gSkip').onclick=close;

    faces.forEach(f=>{if((f.n[0]*st+f.n[1]*ct)<=0.001)return;const pts=[P(f.a[0],f.a[1],b.z0),P(f.e[0],f.e[1],b.z0),P(f.e[0],f.e[1],b.z1),P(f.a[0],f.a[1],b.z1)];poly(pts,shade(b.c,-0.1+0.08*(f.n[0]*0.6-f.n[1]*0.3)),'rgba(0,0,0,.18)');
      if(b.im){const rgt=[b.fy,-b.fx];const key=(f.n[0]===b.fx&&f.n[1]===b.fy)?'front':(f.n[0]===-b.fx&&f.n[1]===-b.fy)?'back':(f.n[0]===rgt[0]&&f.n[1]===rgt[1])?'right':'left';const g=b.im[key];if(g){const len=Math.hypot(f.e[0]-f.a[0],f.e[1]-f.a[1]);ctx.save();plane([f.a[0],f.a[1],b.z1],[(f.e[0]-f.a[0])/len,(f.e[1]-f.a[1])/len,0],[0,0,-1]);ctx.drawImage(g,0,0,len,b.z1-b.z0);ctx.restore();reset()}}});
    poly([[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]].map(([x,y])=>P(x,y,b.z1)),shade(b.c,.06),'rgba(0,0,0,.18)');
    if(b.im&&b.im.top){const rx=b.fy,ry=-b.fx;const ox=rx>0?b.x0:rx<0?b.x1:(b.fx>0?b.x0:b.x1),oy=ry>0?b.y0:ry<0?b.y1:(b.fy>0?b.y0:b.y1);const lu=rx!==0?(b.x1-b.x0):(b.y1-b.y0),lv=rx!==0?(b.y1-b.y0):(b.x1-b.x0);ctx.save();plane([ox,oy,b.z1],[rx,ry,0],[b.fx,b.fy,0]);ctx.drawImage(b.im.top,0,0,lu,lv);ctx.restore();reset()}});
  ctx.fillStyle='#5E6660';ctx.font='12px sans-serif';ctx.fillText(`${r.name} · ${r.W}×${r.D}×${r.H}`,10,Hh-10)}
function shade(hex,amt){let c=String(hex||'#cccccc').replace('#','');if(!/^[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(c))c='cccccc';if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16);const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);const h2=v=>clamp(f(v),0,255).toString(16).padStart(2,'0');return'#'+h2((n>>16)&255)+h2((n>>8)&255)+h2(n&255)}

// ================= render =================
function render(){const r=R();$('#roomBtn').textContent=r.name+' ▾';$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab!=='house')scaleMode=null;
  if(tab==='plan')renderPlanTab();else if(tab==='house')renderHouseTab();else if(tab==='3d')render3dTab();else if(tab==='room')renderRoomTab();else if(tab==='check')renderCheckTab();else renderToolsTab();
  renderSelbar();updUndo()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-guide]');if(g&&!e.target.closest('.guide')){showGuide(g.dataset.guide,false)}});
$$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab!=='plan'&&tab!=='house')selKind=null;render();window.scrollTo(0,0);maybeTabGuides(tab)});
$('#roomBtn').onclick=roomsSheet;$('#undoB').onclick=undo;$('#redoB').onclick=redo;$('#helpB').onclick=()=>{const l=tabGuides(tab);if(l.length)showList(l);else showGuide('start',false)};
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(tab==='plan')drawPlan();else if(tab==='house')drawHouse();else if(tab==='3d')draw3d();else if(tab==='check')render()},120)});
render();
if(!GSEEN.has('start'))setTimeout(()=>showGuide('start',false),300);else maybeTabGuides(tab);
})();
</script>
